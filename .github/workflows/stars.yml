name: Update badges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/stars.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute total stars and downloads
        uses: actions/github-script@v7
        id: compute
        with:
          script: |
            const fs = require('fs');
            const username = 'rasuvaeff';
            const starsPath = '.github/badges/stars.json';
            const downloadsPath = '.github/badges/downloads.json';

            const repos = await octokit.paginate(
              octokit.rest.repos.listForUser,
              { username, per_page: 100, type: 'owner' }
            );
            const stars = repos
              .filter(r => !r.fork)
              .reduce((sum, r) => sum + r.stargazers_count, 0);

            const names = (await (await fetch('https://packagist.org/packages/list.json?vendor=rasuvaeff')).json()).packageNames;
            let downloads = 0;
            for (const name of names) {
              const pkg = await (await fetch(`https://packagist.org/packages/${name}.json`)).json();
              downloads += pkg.package.downloads.total;
            }

            fs.mkdirSync('.github/badges', { recursive: true });
            let changed = false;

            const write = (path, badge) => {
              let fileChanged = true;
              try {
                const cur = JSON.parse(fs.readFileSync(path, 'utf8'));
                fileChanged = String(cur.message) !== String(badge.message);
              } catch (_) { /* no file yet -> create */ }
              fs.writeFileSync(path, JSON.stringify(badge, null, 2) + '\n');
              changed = changed || fileChanged;
            };

            write(starsPath, {
              schemaVersion: 1,
              label: 'GitHub Stars',
              message: String(stars),
              color: 'FFCC01',
              namedLogo: 'github'
            });
            write(downloadsPath, {
              schemaVersion: 1,
              label: 'Packagist Downloads',
              message: downloads.toLocaleString('en-US'),
              color: 'F28D1A',
              namedLogo: 'packagist'
            });

            core.setOutput('changed', changed);
            core.info(`Total stars: ${stars}, downloads: ${downloads} (changed=${changed})`);

      - name: Commit if changed
        if: steps.compute.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/stars.json .github/badges/downloads.json
          git commit -m "chore: update badges"
          git push
