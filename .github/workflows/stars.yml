name: Update badges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/stars.yml
      - README.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute badges and recent releases
        uses: actions/github-script@v7
        id: compute
        with:
          script: |
            const fs = require('fs');
            const username = 'rasuvaeff';
            const starsPath = '.github/badges/stars.json';
            const downloadsPath = '.github/badges/downloads.json';
            const packagesPath = '.github/badges/packages.json';
            const readmePath = 'README.md';

            const repos = await octokit.paginate(
              octokit.rest.repos.listForUser,
              { username, per_page: 100, type: 'owner' }
            );
            const stars = repos
              .filter(r => !r.fork)
              .reduce((sum, r) => sum + r.stargazers_count, 0);

            const names = (await (await fetch('https://packagist.org/packages/list.json?vendor=rasuvaeff')).json()).packageNames;
            let downloads = 0;
            let packages = 0;
            const releases = [];
            for (const name of names) {
              const pkg = (await (await fetch(`https://packagist.org/packages/${name}.json`)).json()).package;
              downloads += pkg.downloads.total;
              if (pkg.abandoned) continue;
              packages++;
              // packages/<name>.json lags behind new tags; the p2 metadata is fresh.
              const tagged = (await (await fetch(`https://repo.packagist.org/p2/${name}.json`)).json()).packages[name] ?? [];
              const stable = tagged
                .filter(v => /^v?\d+\.\d+\.\d+$/.test(v.version) && v.time)
                .sort((a, b) => b.time.localeCompare(a.time));
              if (stable.length > 0) {
                releases.push({ name: name.split('/')[1], version: stable[0].version, time: stable[0].time });
              }
            }
            releases.sort((a, b) => b.time.localeCompare(a.time));

            fs.mkdirSync('.github/badges', { recursive: true });
            let changed = false;

            const write = (path, badge) => {
              let fileChanged = true;
              try {
                const cur = JSON.parse(fs.readFileSync(path, 'utf8'));
                fileChanged = String(cur.message) !== String(badge.message);
              } catch (_) { /* no file yet -> create */ }
              fs.writeFileSync(path, JSON.stringify(badge, null, 2) + '\n');
              changed = changed || fileChanged;
            };

            write(starsPath, {
              schemaVersion: 1,
              label: 'GitHub Stars',
              message: String(stars),
              color: 'FFCC01',
              namedLogo: 'github'
            });
            write(downloadsPath, {
              schemaVersion: 1,
              label: 'Packagist Downloads',
              message: downloads.toLocaleString('en-US'),
              color: 'F28D1A',
              namedLogo: 'packagist'
            });

            write(packagesPath, {
              schemaVersion: 1,
              label: 'Packages',
              message: String(packages),
              color: '777BB4',
              namedLogo: 'packagist'
            });

            const readme = fs.readFileSync(readmePath, 'utf8');
            const list = releases.slice(0, 5).map(r =>
              `| ${r.time.slice(0, 10)} | [**${r.name}** ${r.version}](https://github.com/${username}/${r.name}/releases/tag/${r.version}) |`
            ).join('\n');
            const updated = readme
              .replace(/<!-- packages:count -->\d+<!-- \/packages:count -->/g, `<!-- packages:count -->${packages}<!-- /packages:count -->`)
              .replace(
                /<!-- releases:start -->[\s\S]*?<!-- releases:end -->/,
                `<!-- releases:start -->\n| Date | Release |\n|---|---|\n${list}\n<!-- releases:end -->`
              );
            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
              changed = true;
            }

            core.setOutput('changed', changed);
            core.info(`Stars: ${stars}, downloads: ${downloads}, packages: ${packages} (changed=${changed})`);

      - name: Commit if changed
        if: steps.compute.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges README.md
          git commit -m "chore: update badges and recent releases"
          git push
